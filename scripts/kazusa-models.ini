version = 1

; The router script exposes the 5090 as CUDA0 and the 4090 as CUDA1.
; Paths are relative to the workspace; start-kazusa-models.ps1 sets that
; directory as llama-server's working directory before launching.

[gemma4-4090]
model = models/Gemma-4-31B-Isometry-Fabled-Persona.i1-Q4_K_S.gguf
load-on-startup = true
device = CUDA1
split-mode = none
gpu-layers = all
ctx-size = 56320
parallel = 1
kv-unified = true
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
spec-draft-model = models/mtp-gemma-4-31B-it-Q8_0.gguf
spec-type = draft-mtp
spec-draft-n-max = 3
spec-draft-device = CUDA1
spec-draft-ngl = all
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0
batch-size = 256
ubatch-size = 128
fit = off
no-mmproj = true
no-context-shift = true
jinja = true
reasoning = auto
reasoning-preserve = true

[qwen27b-5090]
model = models/Qwen3.8-27B-UD-Q6_K_M.gguf
load-on-startup = true
device = CUDA0
split-mode = none
gpu-layers = all
ctx-size = 126976
parallel = 1
kv-unified = true
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
spec-draft-model = models/Qwen3.8-27B-DFlash2-Q4_K_M.gguf
spec-type = draft-dflash
spec-draft-n-max = 5
spec-draft-device = CUDA0
spec-draft-ngl = all
spec-draft-type-k = f16
spec-draft-type-v = f16
batch-size = 1024
ubatch-size = 256
fit = off
no-mmproj = true
no-context-shift = true
jinja = true
reasoning = auto
reasoning-preserve = true
